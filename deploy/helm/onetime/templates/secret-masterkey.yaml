{{- include "onetime.validate" . -}}
{{- if not .Values.masterKey.existingSecret -}}
{{/*
Only rendered when the chart owns the Secret. With masterKey.existingSecret the
chart never sees the key material at all, which is the recommended posture.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "onetime.masterKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onetime.labels" . | nindent 4 }}
  {{- if .Values.masterKey.autoGenerate }}
  annotations:
    # Survive `helm uninstall`. A generated keyring exists in exactly one place;
    # letting Helm garbage-collect it would delete the only copy and with it
    # every secret still stored on the volume.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  {{ include "onetime.masterKeySecretKey" . }}: |-
    {{- include "onetime.masterKeyMaterial" . | nindent 4 }}
{{- end }}
