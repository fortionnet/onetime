{{- include "onetime.validate" . -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onetime.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onetime.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never talks to the Kubernetes API. Declining the token here
# (and again on the pod) means an attacker who gets code execution in the
# container finds no cluster credential waiting for them.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
