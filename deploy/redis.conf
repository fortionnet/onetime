# Redis configuration for the LOCAL DEVELOPMENT stack (docker-compose.yml).
#
# The in-cluster sidecar uses a different, stricter file rendered from
# deploy/helm/onetime/templates/configmap.yaml — that one binds to 127.0.0.1
# only. This file has to listen on the container network so the app container
# can reach it, so it is deliberately NOT a production config.

################################## NETWORK ####################################

# Compose puts app and redis on a private user-defined bridge network and we
# publish no port to the host, so the exposure is the compose network only.
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 300
timeout 0

################################# PERSISTENCE #################################

# RDB snapshots off. A snapshot is a point-in-time copy of live secret metadata;
# restoring one resurrects secrets that were already burned, which is exactly
# the guarantee this service sells. The AOF gives crash recovery without the
# "roll back to an older world" failure mode.
save ""
appendonly yes
appendfsync everysec
# A restart must not silently drop the tail of the log.
aof-load-truncated yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
dir /data

################################### MEMORY ####################################

maxmemory 192mb

# CRITICAL: noeviction, never allkeys-lru.
#
# Every key here is a live secret's metadata. Under memory pressure an eviction
# policy would silently delete secrets that users still hold links to — data
# loss that looks like a bug in the app, with no audit trail. noeviction makes
# writes fail loudly instead, which the app surfaces as a 503.
maxmemory-policy noeviction

#################################### LOGGING ##################################

loglevel notice
# Empty string = log to stdout, which is what container log collectors want.
logfile ""

################################### SECURITY ##################################

# Commands that let anyone with a connection wipe or reshape the dataset.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""
